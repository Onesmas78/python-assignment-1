name: Check answers

# Runs every time you push, and can be started by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install pytest
        run: python -m pip install -r requirements.txt

      - name: Run the checks
        id: tests
        continue-on-error: true
        run: python -m pytest -v --junitxml=results.xml

      - name: Show score
        if: always()
        run: python tools/score.py results.xml

      - name: Mark run as failed if any exercise fails
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Some exercises are not passing yet. Open the 'Summary' page of this run to see which ones."
          exit 1
